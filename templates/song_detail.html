{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="mb-3">
            <a href="{{ url_for('index') }}" class="text-decoration-none text-muted">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Catalog
            </a>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <span class="badge bg-secondary me-2">{{ song.category }}</span>
                        <span class="badge bg-light text-dark border">Key: <strong>{{ song.key }}</strong></span>
                    </div>
                    <button class="btn btn-outline-dark toggle-program-btn" data-song-id="{{ song.id }}">
                        <i class="fa-solid fa-plus me-1"></i> Add to Program
                    </button>
                </div>

                <h1 class="fw-bold text-dark mb-1">{{ song.title }}</h1>
                <p class="text-muted fs-5 mb-4">Artist / Source: {{ song.artist }}</p>

                <hr class="my-4">

                <div class="lyrics-box p-4 rounded shadow-sm">
                    {{ song.lyrics }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
