{% extends "base.html" %}

{% block content %}
<div class="song-sheet">
    <a href="{{ url_for('index') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Tillbaka till sångkatalogen</a>

    <div class="kicker">
        <span>{{ song.category }}</span>
        <span>&bull;</span>
        <span>Tonart: {{ song.key }}</span>
        {% if song.tags %}
        <span>&bull;</span>
        <span>{{ song.tags | join(', ') }}</span>
        {% endif %}
    </div>

    <h1>{{ song.title }}</h1>
    <p class="byline">Artist / Källa: {{ song.artist }}</p>

    <div class="d-flex justify-content-end mb-3">
        <button class="mini-btn toggle-program-btn" data-song-id="{{ song.id }}">
            <i class="fa-solid fa-plus"></i> Lägg till i program
        </button>
    </div>

    <div class="lyrics-box">{{ song.lyrics }}</div>
</div>
{% endblock %}
