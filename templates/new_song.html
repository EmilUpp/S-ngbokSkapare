{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="mb-3">
            <a href="{{ url_for('index') }}" class="text-decoration-none text-muted">
                <i class="fa-solid fa-arrow-left me-1"></i> Tillbaka till sångkatalogen
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h2 class="fw-bold text-dark mb-4"><i class="fa-solid fa-plus-circle text-warning me-2"></i>Lägg till ny sång</h2>

                <form method="POST" action="{{ url_for('new_song') }}">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Sångtitel *</label>
                        <input type="text" class="form-control" id="title" name="title" required placeholder="t.ex. Blinka lilla stjärna">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="artist" class="form-label fw-semibold">Artist / Upphovsman</label>
                            <input type="text" class="form-control" id="artist" name="artist" placeholder="t.ex. Trad./Folkmusik">
                        </div>
                        <div class="col-md-3">
                            <label for="category" class="form-label fw-semibold">Kategori</label>
                            <input type="text" class="form-control" id="category" name="category" placeholder="t.ex. Visa">
                        </div>
                        <div class="col-md-3">
                            <label for="key" class="form-label fw-semibold">Tonart</label>
                            <input type="text" class="form-control" id="key" name="key" placeholder="t.ex. G">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="lyrics" class="form-label fw-semibold">Text & ackord *</label>
                        <textarea class="form-control font-monospace" id="lyrics" name="lyrics" rows="10" required placeholder="Skriv in sångtext och ackord här..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary me-2">Avbryt</a>
                        <button type="submit" class="btn btn-warning fw-semibold px-4">Spara sång</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
