{% extends "base.html" %}

{% block content %}
<div class="form-sheet">
    <a href="{{ url_for('index') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Tillbaka till sångkatalogen</a>

    <h2>Lägg till ny sång</h2>

    <form method="POST" action="{{ url_for('new_song') }}">
        <div class="mb-3">
            <label class="field-label" for="title">Sångtitel *</label>
            <input type="text" class="eld-input" id="title" name="title" required placeholder="t.ex. Blinka lilla stjärna">
        </div>

        <div class="two-col mb-3">
            <div>
                <label class="field-label" for="artist">Artist / Upphovsman</label>
                <input type="text" class="eld-input" id="artist" name="artist" placeholder="t.ex. Trad./Folkmusik">
            </div>
            <div>
                <label class="field-label" for="tags">Taggar</label>
                <input type="text" class="eld-input" id="tags" name="tags" placeholder="t.ex. stämning, genre">
            </div>
        </div>
        <p class="text-muted-eld mb-3" style="font-size:0.88rem;">Separera taggar med kommatecken</p>

        <div class="mb-4">
            <label class="field-label" for="lyrics">Text &amp; ackord *</label>
            <textarea class="eld-input" id="lyrics" name="lyrics" rows="12" required placeholder="Skriv in sångtext och ackord här..."></textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('index') }}" class="btn-quiet">Avbryt</a>
            <button type="submit" class="btn-eld ember"><i class="fa-solid fa-floppy-disk"></i> Spara sång</button>
        </div>
    </form>
</div>
{% endblock %}
