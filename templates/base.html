<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sångbok &amp; Programskapare{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="masthead">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
            <a class="brand" href="{{ url_for('index') }}">
                <i class="fa-solid fa-fire flame"></i>Sångboken
            </a>
            <nav>
                <a href="{{ url_for('index') }}"><i class="fa-solid fa-music me-2"></i>Sångkatalog</a>
                <a class="program-link" href="{{ url_for('view_program') }}">
                    <i class="fa-solid fa-book-open me-2"></i>Lägereldsprogram
                    <span id="program-badge" class="program-badge">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="colophon">
        <div class="container">
            Sångbok &amp; Programskapare &bull; Byggd med Python &amp; Flask
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
